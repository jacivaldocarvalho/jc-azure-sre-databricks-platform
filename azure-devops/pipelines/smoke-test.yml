# Temporary smoke test pipeline to validate the service connection.
# This file will be removed in Sub-etapa 4.3.

trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureCLI@2
  displayName: 'Validate Service Connection'
  inputs:
    azureSubscription: 'azure-jc-carvalho'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      set -e
      echo "Authentication validated."
      echo ""
      echo "--- Account context ---"
      az account show --query "{Name:name, SubscriptionId:id, TenantId:tenantId, User:user.name}" -o table
      echo ""
      echo "--- Subscription details ---"
      az account list --query "[?id=='b4a10bfb-2a0e-43e7-bd50-ceb4624f160f'].{Name:name, State:state}" -o table
      echo ""
      echo "--- Smoke test complete ---"
