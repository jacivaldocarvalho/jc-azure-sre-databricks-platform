# Default values for jc-sre-api.
# Override these values with --set or a custom values file.

replicaCount: 1

image:
  repository: jc-sre-databricks-api
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: jc-sre.local
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1536Mi

# Delta warehouse volume.
# In Kind, this uses a hostPath mounted from the host machine.
# In AKS, this would use an Azure Files PVC or an init container that
# syncs from ADLS.
persistence:
  enabled: true
  hostPath: /data/spark-warehouse
  mountPath: /data/spark-warehouse
  readOnly: true

# Application configuration (non-secret)
config:
  environment: local
  logLevel: info
  deltaWarehousePath: /data/spark-warehouse

# Probes
livenessProbe:
  initialDelaySeconds: 90
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Autoscaling (disabled by default; can be enabled when HPA is supported)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# ServiceAccount
serviceAccount:
  create: true
  name: jc-sre-api

# Pod annotations
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
