apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jc-sre-api.fullname" . }}-config
  labels:
    {{- include "jc-sre-api.labels" . | nindent 4 }}
data:
  DELTA_WAREHOUSE_PATH: {{ .Values.config.deltaWarehousePath | quote }}
  API_HOST: "0.0.0.0"
  API_PORT: "8080"
  API_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ENVIRONMENT: {{ .Values.config.environment | quote }}
